# Meowcoin Configuration File
#
# FOR LOCAL/NATIVE INSTALLATION ONLY  
# Docker users: This file is not used - configuration is handled via docker-compose.yml
#
# Usage: Copy this file to your Meowcoin data directory:
# - Windows: %APPDATA%\Meowcoin\meowcoin.conf
# - Linux: ~/.meowcoin/meowcoin.conf
# - macOS: ~/Library/Application Support/Meowcoin/meowcoin.conf

# RPC Settings
rpcuser=meowcoin_user
rpcpassword=your_secure_mewc_password_here
rpcallowip=127.0.0.1
rpcbind=127.0.0.1:8766
rpcport=8766

# ZMQ Settings (for instant block notifications)
zmqpubhashblock=tcp://127.0.0.1:28433

# Network Settings
server=1
listen=1
daemon=0
printtoconsole=1
port=8767

# AuxPoW Settings (if supported by meowcoin)
auxpow=1

# Mining Settings
gen=0

# Connection Settings
maxconnections=50

# Logging
debug=0

# Database Settings
dbcache=256

# Pruning (optional - saves disk space)
# Uncomment to enable pruning and set size in MB (minimum 550 MB)
# Example: prune=2000 for ~2GB max blockchain size
# prune=2000

# For testnet (uncomment if needed)
# testnet=1
# [test]
# rpcport=18766
# port=18767