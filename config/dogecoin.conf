# Dogecoin Configuration File
# 
# FOR LOCAL/NATIVE INSTALLATION ONLY
# Docker users: This file is not used - configuration is handled via docker-compose.yml
# 
# Usage: Copy this file to your Dogecoin data directory:
# - Windows: %APPDATA%\Dogecoin\dogecoin.conf
# - Linux: ~/.dogecoin/dogecoin.conf
# - macOS: ~/Library/Application Support/Dogecoin/dogecoin.conf

# RPC Settings
rpcuser=dogecoin_user
rpcpassword=your_secure_doge_password_here
rpcallowip=127.0.0.1
rpcbind=127.0.0.1:22555
rpcport=22555

# ZMQ Settings (for instant block notifications)
zmqpubhashblock=tcp://127.0.0.1:28444

# Network Settings
server=1
listen=1
daemon=0
printtoconsole=1

# Mining Settings
gen=0

# Connection Settings
maxconnections=50

# Logging
debug=0

# Database Settings
dbcache=300

# Pruning (optional - saves disk space)
# Uncomment to enable pruning and set size in MB (minimum 550 MB)
# Example: prune=10000 for ~10GB max blockchain size
# Note: Dogecoin blockchain is large (~80GB+), pruning recommended for mining
# prune=10000

# For testnet (uncomment if needed)
# testnet=1
# [test]
# rpcport=44555
# port=44556
