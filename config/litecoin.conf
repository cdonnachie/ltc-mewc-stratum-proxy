# Litecoin Configuration File
# 
# FOR LOCAL/NATIVE INSTALLATION ONLY
# Docker users: This file is not used - configuration is handled via docker-compose.yml
# 
# Usage: Copy this file to your Litecoin data directory:
# - Windows: %APPDATA%\Litecoin\litecoin.conf
# - Linux: ~/.litecoin/litecoin.conf
# - macOS: ~/Library/Application Support/Litecoin/litecoin.conf

# RPC Settings
rpcuser=litecoin_user
rpcpassword=your_secure_ltc_password_here
rpcallowip=127.0.0.1
rpcbind=127.0.0.1:9332
rpcport=9332

# ZMQ Settings (for instant block notifications)
zmqpubhashblock=tcp://127.0.0.1:28332

# Network Settings
server=1
listen=1
daemon=0
printtoconsole=1

# Mining Settings
gen=0

# Connection Settings
maxconnections=50

# Logging
debug=0

# Database Settings
dbcache=512

# For testnet (uncomment if needed)
# testnet=1
# [test]
# rpcport=19332
# port=19335